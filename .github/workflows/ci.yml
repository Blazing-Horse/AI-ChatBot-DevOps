name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install packages
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests (pytest)
        run: pytest -v

  build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Docker image
        run: docker build -t chatbot:${{ github.sha }} .
      - name: Scan image with Trivy (fail on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: chatbot:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  terraform-plan:
    # Dependabot pull requests cannot use the Azure login, so this job is
    # skipped for them. GitHub counts a skipped job as passed.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub prove its identity to Azure (OIDC)
      pull-requests: write # lets the job post the plan as a PR comment
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_acr_name: ${{ vars.ACR_NAME }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_developer_object_id: ${{ vars.DEVELOPER_OBJECT_ID }}
      TF_VAR_image_tag: ${{ github.sha }}
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Init
        run: terraform init -input=false -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
      - name: Validate
        run: terraform validate
      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=5m | tee plan.txt
      - name: Post plan as a PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Terraform plan"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file comment.md
